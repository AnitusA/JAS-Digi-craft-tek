<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
		<style>
			:root {
				--bg: #f6f6f6;
				--panel: #ffffff;
				--border: #d8d8d8;
				--text: #222222;
				--accent: #0d6efd;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: Arial, Helvetica, sans-serif;
				background: var(--bg);
				color: var(--text);
				display: grid;
				place-items: center;
				min-height: 100vh;
			}

			.calc {
				width: 280px;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 12px;
			}

			.screen {
				width: 100%;
				height: 48px;
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 8px 10px;
				font-size: 18px;
				text-align: right;
			}

			.keys {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				margin-top: 10px;
			}

			button {
				height: 40px;
				border: 1px solid var(--border);
				background: #f3f3f3;
				border-radius: 6px;
				font-size: 16px;
				cursor: pointer;
			}

			button:active {
				transform: scale(0.98);
			}

			.op {
				background: #eaf1ff;
				border-color: #c5d8ff;
				color: #0b3d91;
			}

			.eq {
				background: var(--accent);
				color: #ffffff;
				border-color: var(--accent);
			}

			.wide {
				grid-column: span 2;
			}
		</style>
	</head>
	<body>
		<div class="calc">
			<input id="screen" class="screen" type="text" value="" readonly />

			<div class="keys">
				<button data-action="clear" class="op">C</button>
				<button data-action="back" class="op">DEL</button>
				<button data-value="%" class="op">%</button>
				<button data-value="/" class="op">/</button>

				<button data-value="7">7</button>
				<button data-value="8">8</button>
				<button data-value="9">9</button>
				<button data-value="*" class="op">*</button>

				<button data-value="4">4</button>
				<button data-value="5">5</button>
				<button data-value="6">6</button>
				<button data-value="-" class="op">-</button>

				<button data-value="1">1</button>
				<button data-value="2">2</button>
				<button data-value="3">3</button>
				<button data-value="+" class="op">+</button>

				<button data-value="0" class="wide">0</button>
				<button data-value=".">.</button>
				<button data-action="equals" class="eq">=</button>
			</div>
		</div>

		<script>
			const screen = document.getElementById("screen");
			const keys = document.querySelector(".keys");

			const isOperator = (ch) => ["+", "-", "*", "/"].includes(ch);

			const appendValue = (value) => {
				let current = screen.value;

				// Special handling for percent (%) to mimic real calculator behavior
				if (value === "%") {
					if (current === "") return;

					// find last number in the expression
					const numMatch = current.match(/(\d*\.?\d+)$/);
					if (!numMatch) return;
					const num = numMatch[1];
					const prefix = current.slice(0, -num.length);

					// check operator immediately before the number
					const opMatch = prefix.match(/([+\-*/])\s*$/);
					if (opMatch) {
						const op = opMatch[1];
						const beforeOp = prefix.slice(0, -1);
						if (op === "+" || op === "-") {
							// for + or -: treat `A + B%` as `A + (A * B / 100)`
							const baseMatch = beforeOp.match(/(\d*\.?\d+)$/);
							const base = baseMatch ? baseMatch[1] : "0";
							const basePrefix = baseMatch ? beforeOp.slice(0, -base.length) : beforeOp;
							screen.value = basePrefix + base + op + "(" + base + "*" + num + "/100)";
							return;
						} else {
							// for * or /: treat `B%` as `(B/100)` so e.g. A * B% -> A * (B/100)
							screen.value = prefix + "(" + num + "/100)";
							return;
						}
					} else {
						// standalone percentage: convert to fraction (e.g., 50% -> 0.5)
						screen.value = current.slice(0, -num.length) + "(" + num + "/100)";
						return;
					}
				}

				if (isOperator(value)) {
					if (current === "") return;
					if (isOperator(current.slice(-1))) {
						screen.value = current.slice(0, -1) + value;
						return;
					}
				}

				if (value === ".") {
					const parts = current.split(/\+|\-|\*|\//);
					const last = parts[parts.length - 1];
					if (last.includes(".")) return;
				}

				screen.value = current + value;
			};

			const calculate = () => {
				if (screen.value === "") return;
				try {
					const result = Function(`return (${screen.value})`)();
					screen.value = Number.isFinite(result) ? result : "";
				} catch {
					screen.value = "";
				}
			};

			keys.addEventListener("click", (event) => {
				const button = event.target.closest("button");
				if (!button) return;

				const { value } = button.dataset;
				const action = button.dataset.action;

				if (action === "clear") {
					screen.value = "";
					return;
				}

				if (action === "back") {
					screen.value = screen.value.slice(0, -1);
					return;
				}

				if (action === "equals") {
					calculate();
					return;
				}

				if (value) appendValue(value);
			});

			document.addEventListener("keydown", (event) => {
				const { key } = event;

				if ((key >= "0" && key <= "9") || key === ".") {
					appendValue(key);
					return;
				}

				if (isOperator(key)) {
					appendValue(key);
					return;
				}

				if (key === "Enter" || key === "=") {
					event.preventDefault();
					calculate();
					return;
				}

				if (key === "Backspace") {
					screen.value = screen.value.slice(0, -1);
					return;
				}

				if (key.toLowerCase() === "c") {
					screen.value = "";
				}
			});
		</script>
	</body>
</html>
