<html>
    <head>
        <title>Tic Tac Toe Game</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                margin-top: 50px;
            }  
            table {
                margin: 0 auto;
                border-collapse: collapse;
            }
            td {
                width: 60px;
                height: 60px;
                border: 1px solid #c5c6c7;
                font-size: 24px;
                cursor: pointer;
            }
            #message { 
                margin-top: 20px;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <h2>Tic Tac Toe</h2>
        <table id="board">
            <tr>
                <td onclick="makeMove(this, 0, 0)"></td>
                <td onclick="makeMove(this, 0, 1)"></td>
                <td onclick="makeMove(this, 0, 2)"></td>
            </tr>
            <tr>
                <td onclick="makeMove(this, 1, 0)"></td>
                <td onclick="makeMove(this, 1, 1)"></td>
                <td onclick="makeMove(this, 1, 2)"></td>
            </tr>
            <tr>
                <td onclick="makeMove(this, 2, 0)"></td>
                <td onclick="makeMove(this, 2, 1)"></td>
                <td onclick="makeMove(this, 2, 2)"></td>
            </tr>
        </table>

        <div id="message"></div>

        <script>
            let board = [
                ["", "", ""],
                ["", "", ""],
                ["", "", ""]
            ];
            let currentPlayer = "X";

            function makeMove(cell, row, col) {
                if (board[row][col] === "") {
                    board[row][col] = currentPlayer;
                    cell.textContent = currentPlayer;
                    if (checkWin()) {
                        document.getElementById("message").textContent = currentPlayer + " wins!";
                        disableBoard();
                    } else if (checkDraw()) {
                        document.getElementById("message").textContent = "It's a draw!";
                    } else {
                        currentPlayer = currentPlayer === "X" ? "O" : "X";
                    }
                }
            }

            function checkWin() {
                for (let i = 0; i < 3; i++) {
                    if (board[i][0] && board[i][0] === board[i][1] && board[i][1] === board[i][2]) {
                        return true;
                    }
                    if (board[0][i] && board[0][i] === board[1][i] && board[1][i] === board[2][i]) {
                        return true;
                    }
                }
                if (board[0][0] && board[0][0] === board[1][1] && board[1][1] === board[2][2]) {
                    return true;
                }
                if (board[0][2] && board[0][2] === board[1][1] && board[1][1] === board[2][0]) {
                    return true;
                }
                return false;
            }
            </script>
            </body>
</html>
