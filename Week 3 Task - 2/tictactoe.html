<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
            padding: 50px;
        }

        h1 {
            color: black;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
        }

        td {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            font-size: 40px;
            text-align: center;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe Game</h1>

    <p>Player: <strong id="player">X</strong></p>

    <table>
        <tr>
            <td onclick="click(0)"></td>
            <td onclick="click(1)"></td>
            <td onclick="click(2)"></td>
        </tr>
        <tr>
            <td onclick="click(3)"></td>
            <td onclick="click(4)"></td>
            <td onclick="click(5)"></td>
        </tr>
        <tr>
            <td onclick="click(6)"></td>
            <td onclick="click(7)"></td>
            <td onclick="click(8)"></td>
        </tr>
    </table>

    <p id="result"></p>

    <button onclick="reset()">Reset</button>

    <script>
        // Create empty board
        let board = ["", "", "", "", "", "", "", "", ""];

        // Start with player X
        let player = "X";

        // Function when player clicks a cell
        function click(num) {
            // If cell is empty
            if (board[num] === "") {
                // Put player mark in that cell
                board[num] = player;

                // Show the mark on screen
                let cells = document.querySelectorAll("td");
                cells[num].textContent = player;

                // Check if this player won
                if (checkWin()) {
                    document.getElementById("result").textContent = "Player " + player + " Won!";
                    disableBoard();
                    return;
                }

                // Check if board is full (draw)
                if (boardFull()) {
                    document.getElementById("result").textContent = "Draw!";
                    return;
                }

                // Switch player
                if (player === "X") {
                    player = "O";
                } else {
                    player = "X";
                }

                // Show current player
                document.getElementById("player").textContent = player;
            }
        }

        // Function to check if someone won
        function checkWin() {
            // Row 1
            if (board[0] === player && board[1] === player && board[2] === player) return true;

            // Row 2
            if (board[3] === player && board[4] === player && board[5] === player) return true;

            // Row 3
            if (board[6] === player && board[7] === player && board[8] === player) return true;

            // Col 1
            if (board[0] === player && board[3] === player && board[6] === player) return true;

            // Col 2
            if (board[1] === player && board[4] === player && board[7] === player) return true;

            // Col 3
            if (board[2] === player && board[5] === player && board[8] === player) return true;

            // Diagonal 1
            if (board[0] === player && board[4] === player && board[8] === player) return true;

            // Diagonal 2
            if (board[2] === player && board[4] === player && board[6] === player) return true;

            return false;
        }

        // Function to check if board is full
        function boardFull() {
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    return false;
                }
            }
            return true;
        }

        // Function to disable board after game ends
        function disableBoard() {
            let cells = document.querySelectorAll("td");
            for (let i = 0; i < cells.length; i++) {
                cells[i].onclick = null;
            }
        }

        // Function to reset game
        function reset() {
            // Clear board
            board = ["", "", "", "", "", "", "", "", ""];

            // Reset player to X
            player = "X";

            // Clear all cells
            let cells = document.querySelectorAll("td");
            for (let i = 0; i < cells.length; i++) {
                cells[i].textContent = "";
                cells[i].onclick = function() { click(i); };
            }

            // Clear result message
            document.getElementById("result").textContent = "";

            // Show current player
            document.getElementById("player").textContent = player;
        }
    </script>
</body>
</html>
