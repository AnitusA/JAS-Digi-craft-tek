<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
        }
        .gallery {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .photo {
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .photo img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #efefef;
            border: 1px solid #ddd;
            display: block;
        }
        .caption {
            margin-top: 8px;
            font-size: 14px;
            color: #444;
        }
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>
    <div class="gallery">
        <div class="photo">
            <img src="https://i.postimg.cc/yYL1GSVL/Whats_App_Image_2026_01_31_at_10_07_31_AM.jpg" alt="Photo 1">
            <div class="caption">Photo 1</div>
        </div>
        <div class="photo">
            <img src="https://i.postimg.cc/Vv5GLTCm/Whats_App_Image_2026_01_30_at_6_04_15_PM.jpg" alt="Photo 2">
            <div class="caption">Photo 2</div>
        </div>
        <div class="photo">
            <img src="https://i.postimg.cc/Hk12fjBc/Whats_App_Image_2026_01_30_at_5_56_21_PM.jpg" alt="Photo 3">
            <div class="caption">Photo 3</div>
        </div>
        <div class="photo">
            <img src="https://i.postimg.cc/FKmTJ1L6/Whats_App_Image_2026_01_30_at_6_01_41_PM.jpg" alt="Photo 4">
            <div class="caption">Photo 4</div>
        </div>
        <div class="photo">
            <img src="https://i.postimg.cc/QNzVmd3J/Whats_App_Image_2026_01_30_at_3_20_28_PM.jpg" alt="Photo 5">
            <div class="caption">Photo 5</div>
        </div>
        <div class="photo">
            <img src="https://i.postimg.cc/bNkMG75k/Whats_App_Image_2026_01_30_at_5_53_59_PM.jpg" alt="Photo 6">
            <div class="caption">Photo 6</div>
        </div>
    </div>
</body>
</html>
